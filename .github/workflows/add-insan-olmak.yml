name: Add İnsan Olmak to Library
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PARALLEL_OKUMA }}
      - name: Seed only the new book and its missing chapters
        run: node scripts/seed-insan-olmak.mjs --projectId=paralel-okuma
